<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AI Red Team Playground</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="freechat.css" />
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <div class="brand">Belfius <span>&middot;</span> AI Red Team Playground <span class="event-tag">Devoxx Belgium 2026</span></div>
      <div class="fc-scenario-switch" id="scenario-switch">
        <button type="button" class="fc-tab active" data-scenario="secret">Demo 1 &middot; Extract the secret</button>
        <button type="button" class="fc-tab" data-scenario="restricted">Demo 2 &middot; Bypass a refusal</button>
      </div>
    </header>

    <div class="fc-model-bar">
      <span class="fc-hint">Model:</span>
      <div class="fc-model-switch" id="model-switch"></div>
      <span class="fc-hint">Switch: <kbd>⌥M</kbd></span>
    </div>

    <main class="fc-main">
      <section class="fc-panel">
        <div class="fc-intro" id="fc-intro"></div>
        <div class="chat-log" id="chat-log"></div>
        <form class="chat-input" id="chat-form">
          <textarea id="chat-message" rows="1" placeholder="Type a message, or use a preset below..." autocomplete="off"></textarea>
          <button type="submit">Send</button>
        </form>

        <div class="fc-presets" id="fc-presets"></div>

        <div class="fc-toolbar">
          <button type="button" class="fc-reset" id="fc-reset">Reset this conversation</button>
          <span class="fc-hint">Presets: <kbd>⌥1</kbd> <kbd>⌥2</kbd> <kbd>⌥3</kbd> &middot; Switch demo: <kbd>⌥Q</kbd></span>
        </div>
      </section>
    </main>
  </div>

  <script src="freechat.js"></script>
</body>
</html>
